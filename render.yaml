services:
  - type: web
    name: etiquetador-papilares
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    # IMPORTANTE: el plan "Free" de Render NO admite discos persistentes.
    # Si usas Free, todo lo que se guarde en /data (base de datos SQLite +
    # imágenes subidas) se BORRA cada vez que el servicio se reinicia o se
    # vuelve a desplegar. "starter" (o superior) es el plan mínimo que
    # permite adjuntar el disco de abajo.
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # la defines a mano en el dashboard de Render, no queda en el repo
      - key: PUBLIC_BASE_URL
        value: https://etiquetadorapapilares.onrender.com
      - key: LOCK_TIMEOUT_SECONDS
        value: "60"
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
