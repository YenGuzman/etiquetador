services:
  app:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    environment:
      # Cambia esto por una cadena larga y aleatoria en producción.
      SECRET_KEY: "cambia-esta-clave-por-una-aleatoria-y-larga"

      # Bootstrap del primer administrador (solo se usa si no hay ningún
      # usuario todavía). Cambia la contraseña antes de desplegar.
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "cambia-esta-contrasena"

      # IMPORTANTE: debe ser la URL pública real por la que se accede a la
      # app (con https:// si tienes certificado), usada para el flujo de
      # autorización de Google Drive. Sin esto, el login con Google fallará.
      PUBLIC_BASE_URL: "https://tu-dominio.ejemplo.com"

      LOCK_TIMEOUT_SECONDS: "60"
      MAX_UPLOAD_SIZE_MB: "25"
    restart: unless-stopped

volumes:
  app_data:
